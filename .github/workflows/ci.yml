name: ci

# Continuous integration on a clean machine: byte-compile gate, advisory
# dependency install, unit tests and the project self-verification script.
# Author: 晨星

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile gate (hard)
        run: python -m compileall -q -x '\.git|\.venv|node_modules' .

      - name: Install dependencies (test subset, no compiler needed)
        run: |
          python -m pip install --upgrade pip
          # CI 只跑 mock/hash provider，不安装生产可选依赖：
          #   llama-cpp-python 需本地编译 llama.cpp，faiss-cpu / fastembed 体积大。
          # 注意：requirements-dev.txt 里的 `-r requirements.txt` 会绕过过滤正则，
          # 把 llama-cpp-python 重新拖进来并导致整批安装失败，因此这里显式列举。
          python -m pip install fastapi uvicorn pydantic numpy rank-bm25 pypdf httpx loguru pytest
          python -m pip install -e . --no-deps || echo "::warning::editable install skipped (advisory)"

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "no tests/ directory - skipping"
          fi

      - name: Self-verification script (advisory, may rely on local OS tooling)
        continue-on-error: true
        run: |
          for s in scripts/verify.py scripts/selfcheck.py tools/verify.py; do
            if [ -f "$s" ]; then echo "== $s"; python "$s"; exit $?; fi
          done
          echo "no verification script found"
